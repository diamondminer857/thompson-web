<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- Same two faces the site itself loads (see astro.config.mjs). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&family=Space+Grotesk:wght@600&display=block"
      rel="stylesheet"
    />
    <style>
      /* Transparent text layer. generate.mjs calls window.setup(config)
         once, then window.render(seconds) for every frame and screenshots
         it — so every frame is exact and there is no real-time playback. */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
      }

      body {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-family: 'Space Grotesk', system-ui, sans-serif;
      }

      /* Soft scrim so white type survives the busy DJ booth behind it. */
      .scrim {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 42% 32% at 50% 50%, rgba(0, 0, 0, 0.55), transparent 100%);
        opacity: 0;
      }

      .line,
      .card {
        position: absolute;
      }

      .line {
        max-width: 1500px;
        font-family: 'Unbounded', sans-serif;
        font-weight: 800;
        font-size: 92px;
        line-height: 1.14;
        text-align: center;
        text-transform: uppercase;
        text-wrap: balance;
      }

      .line span {
        display: inline-block;
        opacity: 0;
      }

      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 30px;
        opacity: 0;
      }

      .title {
        font-family: 'Unbounded', sans-serif;
        font-weight: 800;
        font-size: 150px;
        line-height: 1;
      }

      .rule {
        width: 140px;
        height: 4px;
        background: linear-gradient(90deg, #5be3ff, #ff5fc0);
      }

      .strap {
        font-weight: 600;
        font-size: 26px;
        letter-spacing: 0.3em;
        text-indent: 0.3em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.8);
      }

      /* The Haven cat on its speaker, heading the title card. */
      .cat {
        height: 250px;
        margin-bottom: -6px;
        transform-origin: 50% 100%;
      }

      .cat svg {
        display: block;
        height: 100%;
        width: auto;
        overflow: visible;
      }
    </style>
  </head>
  <body>
    <div class="scrim"></div>
    <p class="line"></p>

    <div class="card">
      <!-- scripts/haven-mascot/haven-cat.svg, minus its background, with the
           parts grouped by body part. -->
      <div class="cat">
        <svg viewBox="150 205 410 1055" fill="none" stroke="white" stroke-linecap="round" stroke-linejoin="round">
          <g>
            <path d="M252.5 785.5C252.5 785.5 160 778 163 707.5C166 637 209 599.5 209 599.5" stroke-width="12" />
          </g>
          <g>
            <path
              d="M430 462C395.209 505.285 384.5 518 359.5 537.5C334.5 557 305.5 565 284 587.5C262.5 610 247 635.5 243 668.5C239 701.5 238 708 243 737.5C248 767 249 799 277.5 799C306 799 314 798.5 338 793C362 787.5 385 774 393 745.5C401 717 394 673 394 673"
              stroke-width="12"
            />
            <path
              d="M505 490C505 490 519 566 522 589C525 612 527.5 683 528.5 712.5C529.5 742 532 798 522 799.5C518.922 799.962 495.48 800.139 464.5 800.164M287 799.5C287 799.5 394.818 800.219 464.5 800.164M464.5 800.164V668"
              stroke-width="12"
            />
            <g>
              <mask id="cat-head" fill="white">
                <path d="M591 398.5C591 451.795 549.139 495 497.5 495C445.861 495 404 451.795 404 398.5C404 345.205 445.861 302 497.5 302C549.139 302 591 345.205 591 398.5Z" />
              </mask>
              <path
                d="M591 398.5C591 451.795 549.139 495 497.5 495C445.861 495 404 451.795 404 398.5C404 345.205 445.861 302 497.5 302C549.139 302 591 345.205 591 398.5Z"
                stroke-width="24"
                mask="url(#cat-head)"
              />
              <path d="M541.168 304.126C541.168 304.126 508.417 217.167 497.378 223.226C486.339 229.284 478.657 295 478.657 295" stroke-width="12" />
              <path d="M509.5 371C509.5 371 518.5 375 529.5 371C540.5 367 544.5 357.5 544.5 357.5" stroke-width="12" />
              <path d="M464 288C464 288 416.715 244.128 409 254C401.285 263.872 418 323.5 418 323.5" stroke-width="12" />
              <path d="M583 402C575.852 409.431 570.806 409.356 563.5 409.5" stroke-width="8" />
              <path d="M554 402.5L533 393M552 412L529 410M553 422L532.5 430.5" stroke-width="6" />
            </g>
          </g>
          <path
            d="M255 800H514C532.225 800 547 814.775 547 833V1214C547 1232.23 532.225 1247 514 1247H255C236.775 1247 222 1232.23 222 1214V833C222 814.775 236.775 800 255 800Z"
            stroke-width="12"
          />
          <path
            d="M318 1201H452C455.314 1201 458 1203.69 458 1207V1212C458 1215.31 455.314 1218 452 1218H318C314.686 1218 312 1215.31 312 1212V1207C312 1203.69 314.686 1201 318 1201Z"
            stroke-width="6"
          />
          <g>
            <path d="M429 896C429 920.301 409.301 940 385 940C360.699 940 341 920.301 341 896C341 871.699 360.699 852 385 852C409.301 852 429 871.699 429 896Z" stroke-width="12" />
            <circle cx="384.5" cy="895.5" r="15.5" fill="white" stroke="none" />
          </g>
          <g>
            <path d="M476 1073C476 1123.26 435.258 1164 385 1164C334.742 1164 294 1123.26 294 1073C294 1022.74 334.742 982 385 982C435.258 982 476 1022.74 476 1073Z" stroke-width="12" />
            <circle cx="384.5" cy="1072.5" r="24.5" fill="white" stroke="none" />
          </g>
        </svg>
      </div>
      <p class="title">HAVEN</p>
      <div class="rule"></div>
      <p class="strap">Trance mix by Thompson</p>
    </div>

    <script>
      const clamp = (v) => Math.min(1, Math.max(0, v));
      const outCubic = (p) => 1 - (1 - p) ** 3;

      const line = document.querySelector('.line');
      const scrim = document.querySelector('.scrim');
      const card = document.querySelector('.card');
      const [cat, title, rule, strap] = card.children;
      let cfg;
      let spans = [];
      let shownLine = -1;

      // { lines: [{ words, starts: [s…], until }], hits: [[t, a, k]…],
      //   drop, titleOut }
      window.setup = (config) => {
        cfg = config;
      };

      const env = (t) => cfg.hits.reduce((sum, [h, a, k]) => sum + (t >= h ? a * Math.exp(-(t - h) * k) : 0), 0);

      window.render = (t) => {
        const pulse = Math.min(env(t), 2);
        let lineVis = 0;

        const l = cfg.lines.findIndex((ln) => t >= ln.starts[0] && t < ln.until + 0.2);
        if (l !== shownLine) {
          shownLine = l;
          const ln = cfg.lines[l];
          line.innerHTML = ln
            ? ln.words.map((w) => `<span>${w}</span>`).join(' ')
            : '';
          spans = [...line.children];
        }

        if (l >= 0) {
          const ln = cfg.lines[l];
          // Exit: the whole line blurs out fast as the next section hits.
          const exit = clamp((t - ln.until) / 0.16);
          spans.forEach((span, i) => {
            // Entrance: each word slams in on its beat — big, blurred, and
            // transparent, settling to rest in ~0.22 s.
            const e = outCubic(clamp((t - ln.starts[i]) / 0.22));
            const glow = 18 + pulse * 26;
            span.style.opacity = e * (1 - exit);
            span.style.transform = `scale(${1.5 - 0.5 * e + exit * 0.06})`;
            span.style.filter =
              `blur(${(1 - e) * 16 + exit * 22}px) ` +
              `drop-shadow(0 0 ${glow}px rgba(255, 255, 255, ${0.18 + pulse * 0.22})) ` +
              `drop-shadow(0 4px 24px rgba(0, 0, 0, 0.7))`;
            lineVis = Math.max(lineVis, e * (1 - exit));
          });
        }

        // Title card on the drop: letters collapse in from wide tracking
        // and blur, then the rule draws and the strapline fades up.
        const d = t - cfg.drop;
        const a = outCubic(clamp(d / 1.1));
        const out = clamp((t - cfg.titleOut) / 2);
        const cardVis = d >= 0 ? clamp(d / 0.12) * (1 - out) : 0;
        card.style.opacity = cardVis;
        title.style.letterSpacing = `${0.9 - 0.58 * a}em`;
        title.style.textIndent = `${0.9 - 0.58 * a}em`;
        title.style.filter = `blur(${(1 - a) * 18}px) drop-shadow(0 0 ${30 * (1 - a) + 14}px rgba(255, 255, 255, 0.35)) drop-shadow(0 4px 28px rgba(0, 0, 0, 0.7))`;
        cat.style.transform = `scale(${1.25 - 0.25 * a})`;
        cat.style.filter = `blur(${(1 - a) * 10}px) drop-shadow(0 4px 18px rgba(0, 0, 0, 0.75))`;
        rule.style.width = `${140 * outCubic(clamp((d - 0.35) / 0.7))}px`;
        strap.style.opacity = clamp((d - 0.6) / 0.6);

        scrim.style.opacity = Math.max(lineVis, cardVis);
      };
    </script>
  </body>
</html>
