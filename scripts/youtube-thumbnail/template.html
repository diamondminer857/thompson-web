<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- Same two faces the site itself loads (see astro.config.mjs): Unbounded
         for the big display moment, Space Grotesk for everything small and
         tracked. Pulled from Google Fonts at generation time rather than
         self-hosted — this script only ever runs locally, not in the
         browser, so there's no visitor paying for the request. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=Space+Grotesk:wght@600;700&display=block"
      rel="stylesheet"
    />
    <style>
      :root {
        /* The site's own tokens (src/styles/global.css) — kept in sync by
           hand since this file can't import CSS from the Astro project. */
        --paper: #0a0a0a;
        --ink: #fff;
        --ink-3: color-mix(in srgb, var(--ink) 72%, var(--paper));
        --accent-cyan: #5be3ff;
        --accent-magenta: #ff5fc0;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* YouTube's required thumbnail size — shown at a huge range of actual
         sizes (search results, suggested videos, mobile), often quite
         small, so everything here leans bolder/simpler than the square
         Mixcloud artwork rather than just being a resized copy of it. */
      html,
      body {
        width: 1280px;
        height: 720px;
        overflow: hidden;
      }

      body {
        position: relative;
        isolation: isolate;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: 56px;
        background: var(--paper);
        font-family: 'Space Grotesk', system-ui, sans-serif;
      }

      /* The photo, plain — no CSS grade applied (grayscale/contrast/split
         tone/vignette), matching scripts/haven-art's template: colour
         grading is done by hand in Lightroom before the file ever reaches
         this script, so baking a look in here would just fight it. A mask
         hides a thin strip at the very top (room for the logo/label on pure
         black) and ramps to opaque by ~34% — same idea as haven-art's, just
         retuned for this shorter canvas. */
      .photo-frame {
        position: absolute;
        inset: 0;
        z-index: -1;
        -webkit-mask-image: linear-gradient(to bottom, transparent 0%, transparent 10%, black 34%, black 100%);
        mask-image: linear-gradient(to bottom, transparent 0%, transparent 10%, black 34%, black 100%);
      }

      .photo {
        position: absolute;
        inset: 0;
        background-image: var(--photo-url);
        background-size: cover;
        /* Anchored high in the source photo by default — see
           generate.mjs's --position flag to override per photo. */
        background-position: center 8%;
      }

      /* Extra darkening behind the numeral specifically, so the
         gradient-filled glyphs stay legible over whatever the photo is
         doing right there — same idea as `.bottom-scrim` protecting the
         wordmark below. */
      .numeral-scrim {
        position: absolute;
        inset: 0;
        z-index: -1;
        background: radial-gradient(ellipse 78% 40% at 50% 48%, rgba(0, 0, 0, 0.6), transparent 85%);
      }

      /* Extra darkening low in the frame purely so the wordmark below stays
         legible over whatever is happening in the photo at that point. */
      .bottom-scrim {
        position: absolute;
        inset: 0;
        z-index: -1;
        background: linear-gradient(to top, rgba(0, 0, 0, 0.8) 0%, transparent 46%);
      }

      /* The Thompson mark (same path as src/components/Logo.astro) in the
         same corner the site's own nav bar keeps it. */
      .mark {
        position: absolute;
        top: 56px;
        left: 56px;
        width: 68px;
        color: var(--ink);
      }

      .mark svg {
        display: block;
        width: 100%;
        height: auto;
      }

      .label {
        position: relative;
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 19px;
        font-weight: 600;
        letter-spacing: 0.26em;
        text-indent: 0.26em;
        text-transform: uppercase;
        color: var(--ink-3);
      }

      .label::before {
        content: '';
        width: 50px;
        height: 3px;
        background: var(--accent-cyan);
        box-shadow: 0 0 14px -2px var(--accent-cyan);
      }

      .numeral {
        position: relative;
        width: 100%;
        font-family: 'Unbounded', sans-serif;
        font-weight: 800;
        /* Unbounded is wide even at 800 — "#004" at any three-digit episode
           number needs to fit inside the 1168px available width (1280
           canvas minus the 56px side padding twice) with room to spare.
           This has to hold up at genuinely tiny sizes (a search-results
           thumbnail can render under 170px wide), which is the whole reason
           this is the single largest element on the canvas. */
        font-size: 260px;
        line-height: 1;
        letter-spacing: -0.02em;
        text-align: center;
        white-space: nowrap;
      }

      /* Solid fill, deliberately — not the outline treatment the website
         uses at hero size. A thin stroke disappears entirely at the sizes
         YouTube actually renders this at; a filled gradient shape holds up
         at any size. */
      .numeral.solid {
        background: linear-gradient(135deg, var(--accent-cyan), var(--accent-magenta));
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
      }

      /* Kept for parity with haven-art's template / the website's own
         MixCard treatment, for anyone who wants it despite the above. */
      .numeral.outline {
        color: transparent;
        -webkit-text-stroke: 4px var(--accent-magenta);
      }

      .footer {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }

      .rule {
        width: 90px;
        height: 3px;
        background: linear-gradient(90deg, var(--accent-cyan), var(--accent-magenta));
      }

      .wordmark {
        font-weight: 700;
        font-size: 26px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--ink);
      }

      .strapline {
        font-size: 15px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-3);
      }
    </style>
  </head>
  <body>
    <div class="photo-frame">
      <div class="photo"></div>
    </div>
    <div class="numeral-scrim"></div>
    <div class="bottom-scrim"></div>

    <div class="mark">
      <svg viewBox="0 0 1000 1000" fill="currentColor" fill-rule="evenodd" role="img" aria-label="Thompson">
        <path
          d="M182 0H818A182 182 0 0 1 1000 182V818A182 182 0 0 1 818 1000H182A182 182 0 0 1 0 818V182A182 182 0 0 1 182 0ZM219 221H781V783H219ZM273 323H392V442H273ZM608 323H727V442H608ZM288 643H374V673H624V643H710V684A78 78 0 0 1 632 762H366A78 78 0 0 1 288 684Z"
        />
      </svg>
    </div>

    <p class="label">{{LABEL}} — mix series</p>
    <p class="numeral {{STYLE}}">#{{NUMBER}}</p>
    <div class="footer">
      <div class="rule"></div>
      <p class="wordmark">Thompson</p>
      <p class="strapline">Trance &amp; Melodic Techno</p>
    </div>
  </body>
</html>
