<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --accent-cyan: #5be3ff;
        --accent-magenta: #ff5fc0;
        --accent-violet: #b489ff;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* Same deal as haven-intro: fully transparent canvas, not a black
         card. This is a pure light-fixture layer meant to sit on its own
         track — screen/add-blended over your footage in an editor — with
         no footage, text or audio of its own. */
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
      }

      body {
        position: relative;
      }

      /* Soft drifting colour haze behind the beams — the same three hues
         as the site's own hero aura (Hero.astro's `aura-drift`), just
         without the dark backdrop it normally sits on. mix-blend-mode here
         only affects how our own layers blend with each other before
         export; recommend Screen or Add for this whole clip once it's
         over real footage in an editor. */
      /* The blur is the actual feathering — gradient alone still draws a
         geometric (if soft) circle boundary, which is what read as "balls."
         A heavy blur physically destroys that boundary and lets the three
         colours bleed into and mix with each other, which is what makes it
         read as haze filling the frame instead of shapes floating in it. */
      .aura {
        position: absolute;
        inset: -10%;
        mix-blend-mode: screen;
        filter: blur(110px);
      }

      /* Oversized and mostly hanging off-canvas — only each blob's gentle
         inner falloff is ever actually on screen, never an edge — then
         blurred on top of that so nothing reads as a bounded shape at all. */
      .blob {
        position: absolute;
        width: 85%;
        height: 85%;
        border-radius: 50%;
        opacity: 0.32;
      }

      .blob-cyan {
        --blob-color: var(--accent-cyan);
        top: -38%;
        left: -34%;
        animation: drift-a 12s ease-in-out infinite;
      }

      .blob-magenta {
        --blob-color: var(--accent-magenta);
        top: -22%;
        right: -40%;
        animation: drift-b 12s ease-in-out infinite;
      }

      .blob-violet {
        --blob-color: var(--accent-violet);
        bottom: -44%;
        left: 8%;
        animation: drift-c 12s ease-in-out infinite;
      }

      /* A long, gentle multi-stop tail instead of one hard-ish falloff to
         transparent — feeds the blur something gradual to work with rather
         than fighting a sharper edge underneath it. */
      .blob {
        background: radial-gradient(
          circle,
          var(--blob-color) 0%,
          var(--blob-color) 12%,
          transparent 55%
        );
      }

      /* Each drift keyframe returns to its start value, so — combined with
         the beams and flicker below all sharing 12s as a common multiple
         of their own periods — the whole render loops seamlessly at every
         12s mark, however long you actually render. */
      @keyframes drift-a {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        50% {
          transform: translate(4%, -3%) scale(1.08);
        }
      }

      @keyframes drift-b {
        0%,
        100% {
          transform: translate(0, 0) scale(1.05);
        }
        50% {
          transform: translate(-5%, 4%) scale(0.96);
        }
      }

      @keyframes drift-c {
        0%,
        100% {
          transform: translate(0, 0) scale(0.98);
        }
        50% {
          transform: translate(3%, -5%) scale(1.06);
        }
      }

      /* The beams themselves — same recipe as Hero.astro's `.laser`
         (gradient stem + colour-matched box-shadow glow), just rebuilt to
         loop cleanly with no `alternate`: a 0%/50%/100% sweep returns to
         its start angle every 6s instead of relying on ping-pong, and the
         flicker's 2s period and the aura's 12s period both divide evenly
         into that same 12s window. */
      .lasers {
        position: absolute;
        inset: 0;
        overflow: hidden;
        mix-blend-mode: screen;
      }

      .laser {
        position: absolute;
        top: -10%;
        width: 5px;
        height: 130%;
        transform-origin: top center;
        background: linear-gradient(
          to bottom,
          transparent 0%,
          var(--laser-color) 16%,
          var(--laser-color) 55%,
          transparent 96%
        );
        /* Layered glow — a tight bright core plus a much wider soft
           halo — reads as a strong light beam instead of a thin ruled
           line, so it wins the composition against the (now much
           smaller) haze blobs behind it. */
        box-shadow:
          0 0 8px 1px var(--laser-color),
          0 0 60px 8px var(--laser-color);
        animation: laser-sweep 6s ease-in-out infinite, laser-flicker 2s steps(7) infinite;
      }

      .laser-cyan {
        --laser-color: var(--accent-cyan);
      }

      .laser-magenta {
        --laser-color: var(--accent-magenta);
      }

      .laser-violet {
        --laser-color: var(--accent-violet);
      }

      @keyframes laser-sweep {
        0% {
          transform: rotate(-26deg);
        }
        50% {
          transform: rotate(26deg);
        }
        100% {
          transform: rotate(-26deg);
        }
      }

      @keyframes laser-flicker {
        0%,
        100% {
          opacity: 0.85;
        }
        15% {
          opacity: 0.3;
        }
        30% {
          opacity: 0.95;
        }
        45% {
          opacity: 0.45;
        }
        70% {
          opacity: 0.75;
        }
      }
    </style>
  </head>
  <body>
    <div class="aura" aria-hidden="true">
      <span class="blob blob-cyan"></span>
      <span class="blob blob-magenta"></span>
      <span class="blob blob-violet"></span>
    </div>

    <!-- Nine fixtures instead of Hero's five — this clip is the whole show
         rather than a background detail, so it can carry more of them.
         Delays are just phase offsets on an already-periodic function, so
         they don't disturb the 12s loop no matter what they're set to. -->
    <div class="lasers" aria-hidden="true">
      <span class="laser laser-cyan" style="left: 6%; animation-delay: -0.4s, -0.9s;"></span>
      <span class="laser laser-magenta" style="left: 18%; animation-delay: -3.1s, -1.4s;"></span>
      <span class="laser laser-violet" style="left: 30%; animation-delay: -1.7s, -0.2s;"></span>
      <span class="laser laser-cyan" style="left: 42%; animation-delay: -4.4s, -1.1s;"></span>
      <span class="laser laser-magenta" style="left: 54%; animation-delay: -2.2s, -0.6s;"></span>
      <span class="laser laser-violet" style="left: 66%; animation-delay: -5.1s, -1.8s;"></span>
      <span class="laser laser-cyan" style="left: 78%; animation-delay: -0.9s, -0.3s;"></span>
      <span class="laser laser-magenta" style="left: 90%; animation-delay: -3.6s, -1.5s;"></span>
      <span class="laser laser-violet" style="left: 98%; animation-delay: -2.8s, -0.7s;"></span>
    </div>
  </body>
</html>
